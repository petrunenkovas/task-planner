name: Validate pull requests

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - run: npm run format:check
            - run: npm run build
